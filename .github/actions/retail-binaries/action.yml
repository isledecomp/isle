name: Download the retail binaries
description: Fetch CONFIG.EXE, ISLE.EXE, and LEGO1.DLL into legobin/ and check their digests

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p legobin
        for name in CONFIG.EXE ISLE.EXE LEGO1.DLL; do
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
            -fLSs "https://legoisland.org/download/$name" -o "legobin/$name"
        done
        sha256sum --check <<'DIGESTS'
        864766d024d78330fed5e1f6efb2faf815f1b1c3405713a9718059dc9a54e52c  legobin/CONFIG.EXE
        5cf57c284973fce9d14f5677a2e4435fd989c5e938970764d00c8932ed5128ca  legobin/ISLE.EXE
        14645225bbe81212e9bc1919cd8a692b81b8622abb6561280d99b0fc4151ce17  legobin/LEGO1.DLL
        DIGESTS
