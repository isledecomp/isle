name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-current-toolchain:
    name: Current ${{ matrix.toolchain.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.toolchain.shell }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
        - { name: 'MSVC', shell: 'sh', setup-cmake: true, setup-ninja: true, setup-msvc: true, msystem: '', msys-env: '', no-dx5-libs: false, clang-tidy: false, werror: false }
        # - { name: 'msys2 mingw32',  shell: 'msys2 {0}', msystem: mingw32, msys-env: mingw-w64-i686,        clang-tidy: true, werror: true }
        # - { name: 'msys2 clang32',  shell: 'msys2 {0}', msystem: clang32, msys-env: mingw-w64-clang-i686,  clang-tidy: true, werror: true, no-dx5-libs: true }

    steps:
      - name: Set up MSYS2
        if: ${{ !!matrix.toolchain.msystem }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.toolchain.msystem }}
          install: >-
            ${{ matrix.toolchain.msys-env }}-cc
            ${{ matrix.toolchain.msys-env }}-cmake
            ${{ matrix.toolchain.msys-env }}-ninja
            ${{ matrix.toolchain.msys-env }}-clang-tools-extra

      - name: Setup cmake
        if: matrix.toolchain.setup-cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Check Ninja
        if: matrix.toolchain.setup-ninja
        run: ninja --version

      - name: Setup vcvars
        if: matrix.toolchain.setup-msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86  # Use the 64-bit x64-native cross tools to build 32-bit x86 code

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DISLE_USE_DX5_LIBS=${{ !matrix.toolchain.no-dx5-libs }} \
            -DENABLE_CLANG_TIDY=${{ !!matrix.toolchain.clang-tidy }} \
            -DISLE_WERROR=${{ !!matrix.toolchain.werror }} \
            -Werror=dev
          cmake --build build -- -k0

  build:
    name: 'MSVC 4.20'
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        # Use minimum supported version
        cmake-version: '3.15.x'

    # Provision the authenticated MSVC 4.2 toolchain (already carries the
    # C4786 fix that tools/patch_c2.py used to apply) through ReproBit.
    - name: Provision MSVC 4.2
      shell: pwsh
      run: |
        $revision = (Get-Content .github/reprobit-revision -Raw).Trim()
        python -m pip install "git+https://github.com/isledecomp/reprobit.git@$revision"
        rbit toolchain provision --destination "$env:RUNNER_TEMP\msvc42" --no-save

    - name: Build
      shell: cmd
      run: |
        set "MSVC_ROOT=%RUNNER_TEMP%\msvc42"
        set "PATH=%MSVC_ROOT%\bin;%PATH%"
        set "INCLUDE=%MSVC_ROOT%\include;%MSVC_ROOT%\mfc\include"
        set "LIB=%MSVC_ROOT%\lib;%MSVC_ROOT%\mfc\lib"
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "NMake Makefiles"
        cmake --build build

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: CMake-MSVC420-Development
        path: |
          build/CONFIG.EXE
          build/CONFIG.PDB
          build/ISLE.EXE
          build/ISLE.PDB
          build/LEGO1.DLL
          build/LEGO1.PDB
        if-no-files-found: error

  build-beta:
    name: 'MSVC 4.20 (BETA10)'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        # Use minimum supported version
        cmake-version: '3.15.x'

    # Provision the authenticated MSVC 4.2 toolchain (already carries the
    # C4786 fix that tools/patch_c2.py used to apply) through ReproBit.
    - name: Provision MSVC 4.2
      shell: pwsh
      run: |
        $revision = (Get-Content .github/reprobit-revision -Raw).Trim()
        python -m pip install "git+https://github.com/isledecomp/reprobit.git@$revision"
        rbit toolchain provision --destination "$env:RUNNER_TEMP\msvc42" --no-save

    - name: Build
      shell: cmd
      run: |
        set "MSVC_ROOT=%RUNNER_TEMP%\msvc42"
        set "PATH=%MSVC_ROOT%\bin;%PATH%"
        set "INCLUDE=%MSVC_ROOT%\include;%MSVC_ROOT%\mfc\include"
        set "LIB=%MSVC_ROOT%\lib;%MSVC_ROOT%\mfc\lib"
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DISLE_BUILD_BETA10=ON -DISLE_BUILD_LEGO1=OFF -DISLE_BUILD_APP=OFF -DISLE_BUILD_CONFIG=OFF -G "NMake Makefiles"
        cmake --build build

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: CMake-MSVC420-BETA10-Development
        path: |
          build/BETA10.DLL
          build/BETA10.PDB
        if-no-files-found: error
